<!doctype html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1">	
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/style_with_normalize.css">
        <link rel="stylesheet" href="css/style.css"> 
        <title>Wavebreak</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&display=swap" rel="stylesheet">
        <script src="scripts/project_script.js" defer></script>
    </head>
    <body>
        <div id="wrapper">
            <header>
            <h1 id="special_title">
            Weylan Media lab
            </h1>
            </header>
            <main>
                <h2>Wavebreak——otherwise known as Hangman</h2>
                <div id="game_box" class="y_not_box">
                    <div>
                    <img id="hangman_image" src="images/wave0.jpeg" alt="Waves coming in.">
                    </div>
                    <p>Try to guess the word before the waves wash you and your camera away...</p>
                    <div>
                    <div id="masked_word"></div>
                    <div id="hangman_hint"></div>
                    <button id="hint_button" type="button" class="button">Give me a hint</button>
                    </div>
                    <div id="letters"></div>
                    <div id="result"></div>
                    <button id="play_again" hidden="hidden" type="button" class="button">Play again</button>
                </div>
            </main>
            <footer>
                <p>I work on the unceded territories of the 
                <a href="https://www.musqueam.bc.ca/" target="_blank" class="ext_link">xʷməθkʷəy̓əm (Musqueam)</a>, 
                <a href="https://www.squamish.net/" target="_blank" class="ext_link">Sḵwx̱wú7mesh (Squamish),</a> 
                and <a href="https://twnation.ca/" target="_blank" class="ext_link">səlilwətaɬ (Tsleil-Waututh)</a> Nations.</p>
            </footer>
        </div>
    </body>
</html>
